name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
      - name: Lint control SQL
        run: sqlfluff lint controls
      - name: Tests (one planted defect per control)
        run: pytest -q
